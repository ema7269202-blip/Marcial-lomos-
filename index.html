<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcial Lomos · Carta (sin fotos)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf9;--card:#fff;--img:#f3f3f1;--tx:#2b2b2d;--mu:#8a8a8f;--or:#ee5a36;--ln:#e9e9e6;--sh:0 2px 12px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161617;--card:#212123;--img:#2a2a2d;--tx:#f1f1f0;--mu:#9b9ba1;--ln:#333336;--sh:0 2px 12px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:760px;margin:0 auto;padding:0 18px}
header{text-align:center;padding:34px 0 22px}
.logo{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;box-shadow:0 6px 20px rgba(238,90,54,.28);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
header p{color:var(--mu);font-size:14px;margin:8px auto 0;max-width:420px;line-height:1.5}
.s{position:relative;margin:4px 0 6px}
.s svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mu)}
.s input{width:100%;height:52px;border:1.5px solid var(--ln);border-radius:16px;background:var(--card);padding:0 16px 0 46px;font:500 16px inherit;font-family:inherit;color:var(--tx);outline:0;box-shadow:var(--sh)}
.s input:focus{border-color:var(--or)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--ln)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 0 10px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:82px;padding:8px 10px;border:0;background:none;font:700 12.5px inherit;font-family:inherit;color:var(--tx);cursor:pointer;border-radius:14px;opacity:.7;transition:.2s}
.tab svg{width:28px;height:28px;stroke:var(--or);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{opacity:1;background:var(--card);box-shadow:var(--sh)}
section{padding-top:26px;scroll-margin-top:110px}
h2{font-size:22px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
h2:after{content:"";flex:1;height:1px;background:var(--ln)}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--or);margin:18px 0 2px}
.note{font-size:12.5px;color:var(--mu);margin-bottom:2px}
.card{display:grid;grid-template-columns:1fr;background:var(--card);border-radius:20px;box-shadow:var(--sh);margin-top:12px;overflow:hidden;min-height:0;border:1px solid var(--ln)}
.in{padding:16px 14px 16px 18px;display:flex;flex-direction:column;gap:6px}
.nm{font-size:17px;font-weight:800;line-height:1.25}
.ds{font-size:12.5px;color:var(--mu);line-height:1.45}
.pr{font-size:18px;font-weight:800;color:var(--or);margin-top:auto}
.im{background:var(--img);display:grid;place-items:center;border-left:1px solid var(--ln)}
.im svg{width:54%;max-width:84px;stroke:var(--mu);opacity:.55;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.im.ph{padding:0}.im img{width:100%;height:100%;object-fit:cover;display:block}
.none{text-align:center;color:var(--mu);padding:50px 0;display:none}
footer{text-align:center;color:var(--mu);font-size:12px;padding:34px 0 40px}
@media(min-width:640px){.nm{font-size:18px}}
</style></head><body>

const $=s=>document.querySelector(s),fmt=n=>n==null?'Consultar':'$'+n.toLocaleString('es-AR'),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const m=$('#m'),tabs=$('#tabs');
tabs.innerHTML=D.map((c,k)=>`<button class="tab${k?'':' on'}" data-k="${k}"><svg viewBox="0 0 24 24"><path d="${IC[c.i]}"/></svg>${c.n}</button>`).join('');
function render(q){
 q=norm(q.trim());let any=false;
 m.innerHTML=D.map((c,k)=>{
  let gs=c.g.map(g=>{
   const its=g.it.filter(i=>!q||norm(i[0]+' '+g.t+' '+(i[2]||'')).includes(q));
   if(!its.length)return'';
   return(g.t?`<h3>${esc(g.t)}</h3>`:'')+(g.note?`<p class="note">${esc(g.note)}</p>`:'')+its.map(i=>`<article class="card"><div class="in"><div class="nm">${esc(i[0])}</div>${i[2]?`<div class="ds">${esc(i[2])}</div>`:''}<div class="pr">${fmt(i[1])}</div></div></article>`).join('')}).join('');
  if(!gs)return'';any=true;
  return`<section id="c${k}"><h2>${c.n}</h2>${gs}</section>`}).join('');
 $('#none').style.display=any?'none':'block';
}
render('');
$('#q').addEventListener('input',e=>render(e.target.value));
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;$('#q').value='';render('');document.getElementById('c'+b.dataset.k).scrollIntoView({behavior:'smooth'})});
let t=0;addEventListener('scroll',()=>{if(t)return;t=requestAnimationFrame(()=>{t=0;let cur=0;D.forEach((c,k)=>{const s=document.getElementById('c'+k);if(s&&s.getBoundingClientRect().top<140)cur=k});
 document.querySelectorAll('.tab').forEach((b,k)=>{const on=k==cur;if(on&&!b.classList.contains('on'))b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});b.classList.toggle('on',on)})})},{passive:true});
</script></body></html>
